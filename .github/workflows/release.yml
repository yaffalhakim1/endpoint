name: Release

# Builds the app for macOS, Windows and Linux when a version tag is pushed,
# and attaches what it built to that tag's release page.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The Linux runners make the Windows app too: MyGo needs no cgo. The
      # installer wants NSIS, which the runner has to fetch.
      - name: Install NSIS, for the Windows installer
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Test
        if: matrix.name == 'Linux'
        run: go test ./...

      - name: Build
        run: go tool mygo build -platform "${{ matrix.platform }}"

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/**/*
          fail_on_unmatched_files: false
